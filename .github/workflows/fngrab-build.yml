name: Build FNGrab
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - buildlog.txt
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: build
        run: |
          {
            set -x
            export ANDROID_HOME=/usr/local/lib/android/sdk
            export ANDROID_SDK_ROOT=$ANDROID_HOME
            export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
            sdkmanager "platforms;android-34" "build-tools;34.0.0"
            curl -fsSL -o src.zip https://raw.githubusercontent.com/jiepinliang/iptv-api/master/.github/workflows/fengniao-grab-src.zip
            unzip -q src.zip -d s
            cd s/fengniao-grab
            sed -i "s#allprojects { repositories { google(); mavenCentral() } }#allprojects { repositories { google(); mavenCentral(); maven { url 'https://api.xposed.info/' } } }#" build.gradle
            gradle assembleRelease --no-daemon
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
            $BT/zipalign -f 4 "$APK" m.apk
            keytool -genkeypair -keystore ks.jks -alias k -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=dev" -noprompt
            $BT/apksigner sign --ks ks.jks --ks-pass pass:123456 --key-pass pass:123456 --out /tmp/FNGrab-module.apk m.apk
            ls -l /tmp/FNGrab-module.apk
          } > /tmp/out.txt 2>&1
          tail -20 /tmp/out.txt
      - name: 发布模块
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fngrab-module-v1
          files: /tmp/FNGrab-module.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 日志回写
        if: always()
        run: |
          tail -c 9000 /tmp/out.txt > buildlog.txt || echo "no log" > buildlog.txt
          git config user.email ci@ci.local
          git config user.name ci
          git add buildlog.txt
          git commit -m "ci log [skip ci]" || true
          git push origin HEAD:master || true
