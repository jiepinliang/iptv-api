name: Build FNGrab
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: build
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
          curl -sL -o p.zip https://raw.githubusercontent.com/jiepinliang/iptv-api/master/.github/workflows/fengniao-grab-src.zip
          unzip -q p.zip -d s
          cd s/fengniao-grab
          gradle assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          $BT/zipalign -f 4 "$APK" a.apk
          keytool -genkeypair -keystore ks.jks -alias k -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=dev" -noprompt
          $BT/apksigner sign --ks ks.jks --ks-pass pass:123456 --key-pass pass:123456 --out /tmp/FNGrab.apk a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: /tmp/FNGrab.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: fngrab-v1
          files: /tmp/FNGrab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
