name: Build FNGrab
on: [workflow_dispatch, push]
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: build
        run: |
          set -o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
          curl -sL -o p.zip https://raw.githubusercontent.com/jiepinliang/iptv-api/master/.github/workflows/fengniao-grab-src.zip
          unzip -q p.zip -d s
          cd s/fengniao-grab
          sed -i "s#allprojects { repositories { google(); mavenCentral() } }#allprojects { repositories { google(); mavenCentral(); maven { url 'https://api.xposed.info/' } } }#" build.gradle
          cat build.gradle
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/out.txt
      - name: sign
        run: |
          cd s/fengniao-grab
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          $BT/zipalign -f 4 "$APK" a.apk
          keytool -genkeypair -keystore ks.jks -alias k -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=dev" -noprompt
          $BT/apksigner sign --ks ks.jks --ks-pass pass:123456 --key-pass pass:123456 --out /tmp/FNGrab.apk a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: /tmp/FNGrab.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: fngrab-v1
          files: /tmp/FNGrab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 失败时报告日志
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 6000 /tmp/out.txt > /tmp/tail.txt || echo "no log" > /tmp/tail.txt
          gh issue create -R $GITHUB_REPOSITORY -t "FNGrab build failed" -F /tmp/tail.txt || true
